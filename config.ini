# Taozi VLX 调测台 · 本地配置
# 由「启动器.exe」读写，run.bat / debug.bat 也会读取这里的 port
# 端口优先级：命令行参数 > 环境变量 PORT > 本文件 > 7860
port=7860
host=127.0.0.1

# ---- 生产消费队列（外部服务定时推图用；改完重启服务生效）----
# 是否开启队列接入：false 时 /api/queue/* 一律 503，调测台功能不受影响
queue_enabled=true
# 排队上限（只算等待中的任务，正在推理的那个不占额度）
queue_max_size=32
# 内存里保留多少条任务记录（超出淘汰最早结束的），防止内存无上限增长
queue_max_records=200
# 队列超限时回给外部服务的建议重试秒数（同时写进 Retry-After 响应头）
queue_retry_after=10
